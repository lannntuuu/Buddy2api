# config.example.toml — template for per-deploy config profiles.
#
# Copy this file to `config.toml` (uses the [default] profile) or
# `config.<name>.toml` (uses a named profile) and edit. The gateway
# auto-loads config.toml on startup.
#
#   python -m gateway.server                        # uses config.toml [default]
#   python -m gateway.server --config prod          # uses config.toml [prod]
#   python -m gateway.server --config config.dev.toml
#   CB_GATEWAY_CONFIG=dev python -m gateway.server
#
# Resolution order (later wins):
#   code default  ->  [default]  ->  [<profile>]  ->  env  ->  CLI flag

[default]

[server]
host = "127.0.0.1"
port = 8787

[admin]
# Auto-generate a token on startup if empty. Set to a fixed value if you
# want the browser cookie to stay valid across restarts.
# token = "cb-admin-xxxxxxxxxxxxxxxxxxxxxxxx"
no_auth = false

[database]
# Leave empty to use the storage default (data/codebuddy_gateway.db).
# When running multiple checkouts (dev + prod) on the same machine, set
# this to a checkout-specific path so they don't race on the same WAL.
# path = "C:/path/to/checkout/data/codebuddy_gateway.db"

[logging]
level = "warning"  # debug | info | warning | error

[workbuddy]
# 账号快照固化目录：导入/刷新 WorkBuddy 账号时，把 .info 内容复制到该目录
# （<uid>.info），之后只依赖此副本，不再读取桌面端会被切换登录覆盖的
# workbuddy-desktop.info。留空则用 data/workbuddy_snapshots。
# 也可用环境变量 CB_WORKBUDDY_SNAPSHOT_DIR 覆盖。
# snapshot_dir = "C:/path/to/checkout/data/workbuddy_snapshots"
