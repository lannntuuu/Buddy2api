[pytest]
testpaths = .
addopts = -ra -m "not bench"
# Make the six source modules (src/{accounts,gateway,providers,storage,upstream,web})
# importable as `accounts`, `gateway`, etc. without a leading `src.` prefix.
pythonpath = ../src
# bench_*.py 是性能基准脚本(tests/bench/),默认被上面的 -m "not bench" 跳过;
# 显式运行: python -m pytest tests/bench -m bench -s (结果写 .tmp/bench/last.json)
python_files = test_*.py bench_*.py
markers =
    bench: 性能基准脚本(默认跳过,用 -m bench 显式运行)
norecursedirs = pytest-cache-files-* __pycache__ .pytest_cache .git .venv .tmp data docs ops src web node_modules
